name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 発布対象を _site に組み立てる。
      # EXCLUDE に入れたものは repo に残るが公開されない。
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'demos/renovation-plan' \
            --exclude 'demos/*/qr-*.png' \
            --exclude 'demos/*/PROMPT.md' \
            --exclude 'demos/*/CONTEXT.md' \
            --exclude 'demos/*/docs' \
            --exclude 'demos/*/logo-source.*'
          echo "--- deployed tree ---"
          find _site -maxdepth 2 -not -path '*/.*' | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
