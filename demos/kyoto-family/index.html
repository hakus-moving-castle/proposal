<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>京都・家族の七日 — 2026.9.17–23</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F5EE">
<script>
/* 夜のテーマは描画前に決める。あとから付けると一瞬白く光る。
   時刻だけで判断する — OS のダーク設定には従わない（昼間に暗くなると紙のほうが読みにくい）。 */
(function(){
  try{
    var q=(location.search.match(/[?&]theme=(night|day)/)||[])[1];
    var pref=null; try{ pref=localStorage.getItem('kf.theme'); }catch(e){}
    var h=new Date().getHours();
    var night = q ? (q==='night') : (pref==='night' ? true : pref==='day' ? false : (h>=17||h<6));
    if(night){
      document.documentElement.setAttribute('data-theme','night');
      var m=document.querySelector('meta[name="theme-color"]'); if(m)m.setAttribute('content','#151814');
    }
  }catch(e){}
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="京都七日">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* ==========================================================================
   秋雨・苔（あきさめ・こけ）

   9月の京都は「降ったり止んだり」。晴れ前提の配色にしない。
   地は生成り、線は髪の毛ほど、見出しは明朝。
   箱で囲うのは「押す・見せる・気をつける」ものだけ。
   それ以外は余白と罫線で分ける — 全部を箱にすると帳簿になる。
   ========================================================================== */
:root{
  color-scheme: light;
  --paper:#F7F5EE;
  --paper-2:#F0EDE2;
  --card:#FFFDF8;
  --line:#DCD8C9;
  --line-soft:#E9E5D8;
  --ink:#2B2F29;
  --ink-2:#5E6459;
  --ink-3:#928F82;
  --moss:#4A6042;
  --moss-d:#2E3A2E;
  --moss-l:#E8EDE3;
  --gold:#9A7C42;
  --gold-l:#F4EEDD;
  --rain:#4C6B7D;
  --rain-l:#E5EDF1;
  --warn:#A4452B;
  --warn-l:#F8E8E2;
  /* 枠線・文字色。夜で入れ替えるのでここに出しておく */
  --moss-b:#C9D7C2;
  --gold-b:#E1D2B1;
  --warn-b:#E6C4B7;
  --gold-t:#6B5423;
  --warn-t:#6D2D1B;
  --on-moss:#F1F5EE;
  --top-bg:rgba(247,245,238,.90);
  --mist-a:rgba(255,255,255,.9);
  --mist-b:rgba(247,245,238,0);

  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","Hiragino Mincho ProN",serif;
  /* 日本語は必ず日本語フォントで。中文フォントだと「条」「直」などの字形が変わり、
     駅員に見せたときに一瞬引っかかる。 */
  --ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;

  --pad:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

/* ==========================================================================
   夜のいろ — 秋雨の夜
   17:00 を境に、攻略ページ自身も暗くなる。
   九月の京都は 18 時過ぎにはもう暗い。
   夕方に駅のホームで出すものが白く光るのは、目にも電池にもよくない。
   ========================================================================== */
:root[data-theme="night"]{
  color-scheme:dark;
  --paper:#151814;
  --paper-2:#1C201A;
  --card:#1D211B;
  --line:#363D33;
  --line-soft:#2A3027;
  --ink:#E9ECE2;
  --ink-2:#AAB1A3;
  --ink-3:#7B8276;
  --moss:#8CA882;
  --moss-d:#0E120C;
  --moss-l:#232B20;
  --moss-b:#3C4A37;
  --gold:#C3A468;
  --gold-l:#2A2519;
  --gold-b:#4A4029;
  --gold-t:#D9BE86;
  --rain:#8FB2C6;
  --rain-l:#1B242A;
  --warn:#DB8168;
  --warn-l:#2C1B15;
  --warn-b:#4E2E23;
  --warn-t:#E8A18C;
  --on-moss:#121611;
  --top-bg:rgba(21,24,20,.92);
  --mist-a:rgba(190,205,185,.13);
  --mist-b:rgba(21,24,20,0);
}
/* 夜は霧と青海波を弱める — 暗い地の上だと模様のほうが前に出てしまう */
:root[data-theme="night"] .seigaiha{opacity:.16}
:root[data-theme="night"] .m1,
:root[data-theme="night"] .m2{filter:blur(10px)}
/* 抽斗と門は元から暗い。夜はさらに一段落として地と差をつける */
:root[data-theme="night"] #drawer{box-shadow:-2px 0 30px rgba(0,0,0,.55)}
:root[data-theme="night"] .fork-h{background:#0E120C}
/* QR と日本語カードの白は残す。読み取りと視認は暗転より優先。 */
:root[data-theme="night"] .qrbox img{background:#fff}
:root[data-theme="night"] .showcard{background:#F2F0E8}
:root[data-theme="night"] .showcard .jp{color:#16180F}
:root[data-theme="night"] .showcard .lb{color:#6E6A5C}
:root[data-theme="night"] .card-shadow{box-shadow:0 6px 22px rgba(0,0,0,.35)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15.5px;
  line-height:1.86;
  letter-spacing:.012em;
  -webkit-font-smoothing:antialiased;
}
html.locked,html.locked body{overflow:hidden;height:100%}

.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 var(--pad)}

/* ---------- 上部 ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--top-bg);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line-soft);
  padding-top:var(--safe-t);
}
.top-in{
  max-width:600px;margin:0 auto;padding:0 var(--pad);
  display:flex;align-items:center;gap:14px;height:52px;
}
.burger{
  width:34px;height:34px;margin-right:-7px;flex:0 0 auto;
  border:0;background:transparent;cursor:pointer;padding:0;
  display:grid;place-items:center;
}
.burger i{
  display:block;width:19px;height:1.5px;background:var(--ink);
  position:relative;transition:.24s cubic-bezier(.2,.8,.2,1);
}
.burger i::before,.burger i::after{
  content:'';position:absolute;left:0;width:19px;height:1.5px;background:var(--ink);
  transition:.24s cubic-bezier(.2,.8,.2,1);
}
.burger i::before{top:-6px}
.burger i::after{top:6px}
html.drawer .burger i{background:transparent}
html.drawer .burger i::before{top:0;transform:rotate(45deg)}
html.drawer .burger i::after{top:0;transform:rotate(-45deg)}

.top-title{
  font-family:var(--serif);font-size:14.5px;letter-spacing:.16em;color:var(--ink-2);
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:0;background:transparent;padding:0;margin:0;text-align:left;cursor:pointer;
}
.top-title:active{opacity:.6}
.top-title b{color:var(--ink);font-weight:600}
.top-day{
  font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;color:var(--ink-3);
  flex:0 0 auto;font-variant-numeric:tabular-nums;
}

/* ---------- 抽斗 ---------- */
#scrim{
  position:fixed;inset:0;z-index:60;background:rgba(30,34,29,.42);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
html.drawer #scrim{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(85vw,330px);
  background:var(--moss-d);color:#E9EDE4;
  transform:translateX(101%);transition:transform .34s cubic-bezier(.2,.85,.25,1);
  overflow:auto;padding:calc(26px + var(--safe-t)) 0 calc(26px + var(--safe-b));
  box-shadow:-2px 0 30px rgba(0,0,0,.2);
}
html.drawer #drawer{transform:none}
.dw-head{
  display:block;width:100%;padding:0 24px 18px;border:0;background:transparent;
  text-align:left;cursor:pointer;font-family:inherit;
}
.dw-head .t{display:block;font-family:var(--serif);font-size:19px;letter-spacing:.14em;color:#F1F4EC}
.dw-head .s{display:block;font-size:11.5px;letter-spacing:.12em;color:#8D9C88;margin-top:3px}
.dw-head:active{opacity:.7}
.dw-sec{
  font-family:var(--serif);font-size:10.5px;letter-spacing:.3em;color:#7C8C78;
  padding:20px 24px 7px;
}
.dw-i{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 24px;border:0;background:transparent;color:#DDE4D8;
  font-family:inherit;font-size:15px;text-align:left;cursor:pointer;letter-spacing:.03em;
  border-right:2px solid transparent;
}
.dw-i:hover{background:rgba(255,255,255,.05)}
.dw-i[aria-current="true"]{background:rgba(255,255,255,.09);border-right-color:#C3A468;color:#FFF}
.dw-i .d{
  font-family:var(--serif);font-size:13px;color:#93A38E;min-width:38px;
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
.dw-i[aria-current="true"] .d{color:#C3A468}
.dw-i .x{font-size:10.5px;color:#8D9C88;margin-left:auto;letter-spacing:.06em;flex:0 0 auto}
.dw-i .ic{width:20px;text-align:center;flex:0 0 auto;opacity:.9}
.dw-rule{height:1px;background:rgba(255,255,255,.09);margin:14px 24px}

/* ---------- 日の扉 ---------- */
.daytop{position:relative;overflow:hidden;padding:44px 0 4px}
.daytop .wrap{position:relative;z-index:2}
.art{position:absolute;inset:0;z-index:1;pointer-events:none}
.mist{
  position:absolute;left:-28%;width:156%;border-radius:50%;
  background:radial-gradient(58% 50% at 50% 50%,
    var(--mist-a), var(--mist-b) 72%);
  filter:blur(6px);
}
.m1{top:18%;height:130px;animation:drift 26s ease-in-out infinite alternate}
.m2{top:52%;height:96px;opacity:.66;animation:drift 36s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
/* 足元の青海波。雨の日の水たまりのつもり。 */
.seigaiha{
  position:absolute;left:0;right:0;bottom:0;height:88px;opacity:.085;
  background-image:radial-gradient(circle at 50% 100%,
    transparent 44%, var(--moss) 44%, var(--moss) 47.5%, transparent 47.5%);
  background-size:58px 29px;
  -webkit-mask-image:linear-gradient(to top,#000 6%,transparent 100%);
  mask-image:linear-gradient(to top,#000 6%,transparent 100%);
  animation:sDrift 40s ease-in-out infinite alternate;
}
@keyframes sDrift{from{background-position:0 0}to{background-position:58px 0}}

.kicker{
  font-family:var(--serif);font-size:11px;letter-spacing:.34em;color:var(--ink-3);
  margin:0 0 14px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;
}
.dayh{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(25px,7vw,33px);line-height:1.46;letter-spacing:.05em;
  margin:0;
}
.rule{width:40px;height:1px;background:var(--ink-3);opacity:.45;margin:22px 0 0}
.lede{margin:18px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.92}
.lede b{color:var(--ink);font-weight:600}

.chip{
  display:inline-flex;align-items:center;
  border-radius:100px;padding:1px 10px 2px;font-size:10.5px;letter-spacing:.1em;
  border:1px solid var(--line);color:var(--ink-2);font-family:var(--sans);
}
.chip.hol{background:var(--warn-l);border-color:var(--warn-b);color:var(--warn)}
.chip.solo{background:var(--gold-l);border-color:var(--gold-b);color:var(--gold)}
.chip.free{background:var(--moss-l);border-color:var(--moss-b);color:var(--moss)}

/* ---------- 天気 ---------- */
.wx{
  display:flex;align-items:baseline;gap:9px;margin:20px 0 0;
  font-size:13px;color:var(--ink-2);letter-spacing:.04em;
  padding-bottom:14px;border-bottom:1px solid var(--line-soft);
}
.wx .ic{font-size:17px;line-height:1}
.wx .c{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:.08em}
.wx .t{font-variant-numeric:tabular-nums}
.wx .pop{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--rain);font-weight:600;font-size:15px}
.wx .pop em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;margin-left:3px}
.wx.wait,.wx.wait .c{color:var(--ink-3)}
.wx .est{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}

/* ---------- 時間軸 ---------- */
.tl{margin:4px 0 0}
.blk{
  position:relative;padding:22px 0 22px 62px;
  border-bottom:1px solid var(--line-soft);
}
.blk:last-child{border-bottom:0}
.blk .tm{
  position:absolute;left:0;top:24px;width:50px;
  font-family:var(--serif);font-variant-numeric:tabular-nums;
  font-size:14.5px;letter-spacing:.04em;color:var(--moss);line-height:1.4;
}
.blk .tm::after{
  content:'';position:absolute;right:-7px;top:7px;width:5px;height:5px;border-radius:50%;
  background:var(--line);
}
.blk.hi .tm::after{background:var(--moss);box-shadow:0 0 0 3px rgba(74,96,66,.13)}
.blk.warn .tm::after{background:var(--warn);box-shadow:0 0 0 3px rgba(164,69,43,.13)}
.blk.quiet{padding-top:16px;padding-bottom:16px}
.blk.quiet .tm::after{background:transparent;border:1px solid var(--line)}

.nm{
  font-family:var(--serif);font-size:19.5px;font-weight:600;line-height:1.52;
  letter-spacing:.035em;margin:0;
}
.nm .ja{
  font-family:var(--ja);font-weight:400;font-size:12.5px;color:var(--ink-3);
  letter-spacing:.04em;display:block;margin-top:1px;
}
.sub{margin:8px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.88}
.sub b{color:var(--ink);font-weight:600}

/* 移動 */
.move{
  display:flex;align-items:center;gap:10px;margin:12px 0 0;
  font-size:13px;color:var(--ink-2);letter-spacing:.03em;
  padding:10px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
}
.move b{color:var(--ink);font-weight:600;font-family:var(--serif);font-size:14px}
.move .arw{color:var(--ink-3)}
.move .meta{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;line-height:1.6;flex:0 0 auto}

/* 押すところ */
.acts{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12.5px;
  text-decoration:none;cursor:pointer;transition:.18s;letter-spacing:.05em;
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn .g{font-size:12px;opacity:.75}
.btn.ja{border-color:var(--gold-b);background:var(--gold-l);color:var(--gold-t)}
.btn.qr{border-color:var(--moss);background:var(--moss);color:var(--on-moss)}
.btn.tel{border-color:var(--warn-b);background:var(--warn-l);color:var(--warn)}

/* 注意 */
.note{
  margin:13px 0 0;padding:11px 0 11px 14px;border-left:2px solid var(--line);
  font-size:13.5px;line-height:1.86;color:var(--ink-2);
}
.note.warn{border-left-color:var(--warn);color:var(--warn-t)}
.note.warn b{color:var(--warn)}
.note.ok{border-left-color:var(--moss)}
.note.gold{border-left-color:var(--gold)}
.note .h{display:block;font-family:var(--serif);font-size:14.5px;color:var(--ink);margin-bottom:2px}

/* 名寄せリスト */
.row{margin:14px 0 0;padding:0 0 0 14px;border-left:1px solid var(--line-soft)}
.row .h{font-family:var(--serif);font-size:16px;letter-spacing:.03em}
.row p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.86}

/* 店 — 参考用。決めるのは当日のおなか。カードにするのは「電話する・地図を開く」ものだから。 */
.shop-lead{margin:12px 0 0;font-size:12.5px;color:var(--ink-3);letter-spacing:.05em;line-height:1.8}
.shops{display:grid;gap:12px;margin:12px 0 0}
.shop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px}
.shop-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.shop-nm{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.03em;margin:0;line-height:1.5}
.shop-nm .z{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-3);margin-left:7px;letter-spacing:.06em;white-space:nowrap}
.badge{font-size:10px;letter-spacing:.12em;padding:2px 8px;border-radius:100px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.badge.pick{background:var(--moss-l);color:var(--moss)}
.badge.easy{background:var(--gold-l);color:var(--gold-t)}
.shop > p{margin:8px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.86}
.shop > p b{color:var(--ink);font-weight:600}
.shop .yen{font-size:.9em;color:var(--ink-3)}
.shop-meta{display:flex;flex-wrap:wrap;gap:5px 18px;margin:11px 0 0;padding:10px 0 0;border-top:1px solid var(--line-soft)}
.shop-meta div{font-size:12px;color:var(--ink-2);line-height:1.7;min-width:0;max-width:100%}
.shop-meta dt{font-family:var(--serif);font-size:10px;letter-spacing:.14em;color:var(--ink-3);margin:0 0 1px}
.shop-meta dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-break:anywhere}
.shop-meta dd b{font-family:var(--serif);font-size:13.5px;font-weight:600;color:var(--ink)}
.shop .acts{margin-top:11px}
.shop .note{margin-top:10px;padding-top:5px;padding-bottom:5px;font-size:12.5px}

/* 今日つかう券。日の頭に出す。
   「持っているつもり」で改札に立つのが一番こわい。 */
.cert{
  margin:20px 0 0;border:1px solid var(--gold-b);border-radius:12px;
  background:var(--gold-l);overflow:hidden;
}
.cert-h{
  padding:11px 15px 10px;border-bottom:1px solid var(--gold-b);
  font-family:var(--serif);font-size:14.5px;letter-spacing:.08em;color:var(--gold-t);
}
.cert-h .p{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;color:var(--gold);margin-bottom:2px}
.cert-i{padding:12px 15px;border-bottom:1px solid var(--gold-b)}
.cert-i:last-child{border-bottom:0}
.cert-i .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.cert-i .nm b{font-family:var(--serif);font-size:15px;letter-spacing:.03em;color:var(--ink)}
.cert-i p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.8}
.cert-i p b{color:var(--ink)}
.cert-tag{
  font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:100px;white-space:nowrap;
  border:1px solid transparent;
}
.cert-tag.off{background:var(--moss-l);color:var(--moss);border-color:var(--moss-b)}
.cert-tag.net{background:var(--warn-l);color:var(--warn);border-color:var(--warn-b)}
.cert-tag.shot{background:var(--rain-l);color:var(--rain)}
.cert .acts{margin:9px 0 0}

/* 分岐 */
.fork{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.fork-h{
  background:var(--moss-d);color:#E9EDE4;padding:11px 15px;
  font-family:var(--serif);font-size:14px;letter-spacing:.08em;
}
.fork-h .p{display:block;font-family:var(--sans);font-size:11px;color:#96A691;letter-spacing:.12em;margin-bottom:1px}
.fork-l{padding:13px 15px;font-size:13.5px;color:var(--ink-2);line-height:1.86;border-bottom:1px solid var(--line-soft)}
.branch{padding:14px 15px}
.branch + .branch{border-top:1px solid var(--line-soft)}
.branch h4{
  margin:0 0 6px;font-family:var(--serif);font-size:15.5px;letter-spacing:.05em;
  display:flex;align-items:center;gap:8px;
}
.branch.dry h4{color:var(--moss)}
.branch.wet h4{color:var(--rain)}
.branch p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.86}

/* チェック */
.todo{margin:14px 0 0;padding:0;list-style:none}
.todo li{
  display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;
  font-size:14px;line-height:1.8;border-bottom:1px solid var(--line-soft);
}
.todo li:last-child{border-bottom:0}
.todo li .bx{
  flex:0 0 auto;width:19px;height:19px;border:1px solid var(--line);border-radius:5px;
  margin-top:4px;display:grid;place-items:center;font-size:12px;color:transparent;transition:.16s;
  background:var(--card);
}
.todo li[data-on="1"] .bx{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.todo li[data-on="1"] .tx{color:var(--ink-3)}


/* 首頁 —— 「有哪些東西」を一望する。慌てている人が最初に見る画面。 */
.home{padding-top:40px}
.home .hero{position:relative;overflow:hidden;margin:0 calc(var(--pad)*-1);padding:0 var(--pad) 30px}
.home h1{font-family:var(--serif);font-weight:600;font-size:clamp(27px,8vw,37px);letter-spacing:.08em;margin:0;line-height:1.42}
.home .sub{margin:14px 0 0;font-size:13px;color:var(--ink-3);letter-spacing:.12em;font-family:var(--serif)}
.home .now{
  margin:22px 0 0;padding:14px 16px;border-radius:12px;
  background:var(--moss-l);border:1px solid var(--moss-b);
  font-size:14px;color:var(--ink-2);line-height:1.8;
}
.home .now b{color:var(--moss);font-family:var(--serif);font-size:16px;letter-spacing:.04em}
.home .now .go{display:block;margin-top:9px}

.hsec{margin:34px 0 0}
.hsec > h2{
  margin:0 0 12px;font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.22em;
  color:var(--ink-3);display:flex;align-items:center;gap:12px;
}
.hsec > h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.hdays{display:grid;gap:0;border-top:1px solid var(--line-soft)}
.hday{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:13px 2px;border:0;border-bottom:1px solid var(--line-soft);
  background:transparent;font-family:inherit;font-size:15px;color:var(--ink);
  text-align:left;cursor:pointer;
}
.hday:active{background:var(--paper-2)}
.hday .d{
  font-family:var(--serif);font-size:13.5px;color:var(--ink-3);
  min-width:52px;flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.hday .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.03em}
.hday .x{font-size:10.5px;letter-spacing:.08em;flex:0 0 auto;color:var(--ink-3)}
.hday.today{background:var(--gold-l)}
.hday.today .d{color:var(--gold)}
.hday.today .x{color:var(--gold)}

.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{
  display:block;text-align:left;padding:15px 14px;border-radius:12px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);font-family:inherit;color:var(--ink);
}
.hcard:active{background:var(--paper-2)}
.hcard .ic{display:block;font-size:17px;color:var(--moss);line-height:1;margin-bottom:9px}
.hcard .t{display:block;font-family:var(--serif);font-size:15.5px;letter-spacing:.04em;font-weight:600}
.hcard .s{display:block;margin-top:4px;font-size:11.5px;color:var(--ink-3);line-height:1.7;letter-spacing:.02em}

/* 独立ページ */
.page{padding-top:40px}
.page h1{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:.06em;margin:0;line-height:1.44}
.sec{margin:34px 0 0}
.sec > h2{
  margin:0 0 14px;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.18em;
  color:var(--ink-2);display:flex;align-items:center;gap:12px;
}
.sec > h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-size:12.5px;letter-spacing:.08em;white-space:nowrap;padding-top:2px}
.kv dd{margin:0;color:var(--ink)}
.kv dd b{font-family:var(--serif);letter-spacing:.04em}

/* 見せる用の大きな日本語 */
.showcard{
  border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin:12px 0 0;
  text-align:center;background:var(--card);
}
.showcard .lb{font-size:11px;color:var(--ink-3);letter-spacing:.16em;margin:0 0 12px;font-family:var(--serif)}
.showcard .jp{font-family:var(--ja);font-size:25px;font-weight:600;line-height:1.6;margin:0;color:var(--ink);letter-spacing:.02em}
.showcard .jp.sm{font-size:19px;line-height:1.72}

.qrbox{text-align:center;margin:14px 0 0}
.qrbox img{width:100%;max-width:320px;height:auto;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:#fff}
.qrbox .code{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:27px;letter-spacing:.12em;margin:12px 0 0}
.qrbox .cl{font-size:11px;color:var(--ink-3);letter-spacing:.16em;margin:1px 0 0}

.bigno{font-family:var(--serif);font-size:40px;letter-spacing:.24em;line-height:1.3;color:var(--ink);margin:2px 0 4px}

/* シート */
#sheet{position:fixed;inset:0;z-index:90;display:none;background:rgba(30,34,29,.46);align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sheet-in{
  width:100%;max-width:600px;background:var(--paper);
  border-radius:16px 16px 0 0;padding:24px var(--pad) calc(24px + var(--safe-b));
  max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-in h3{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:.06em;font-weight:600}
.sheet-in .lb{font-size:11px;letter-spacing:.2em;color:var(--gold);margin:0 0 6px;font-family:var(--serif)}
.sheet-in p.tip{margin:14px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.85}
.sheet-close{
  display:block;width:100%;margin:20px 0 0;padding:13px;border:1px solid var(--line);
  background:transparent;border-radius:10px;font-family:var(--serif);font-size:14px;
  letter-spacing:.16em;cursor:pointer;color:var(--ink-2);
}

/* 門 */
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--moss-d);padding:26px;overflow:hidden}
#gate[hidden]{display:none}
.gate-art{position:absolute;inset:0;pointer-events:none;opacity:.5}
.gate-art .r{
  position:absolute;left:50%;top:44%;width:620px;height:620px;margin:-310px 0 0 -310px;
  border:1px solid rgba(195,164,104,.5);border-radius:50%;
  transform:scale(.2);opacity:0;animation:rip 14s ease-out infinite;animation-delay:var(--d,0s);
}
@keyframes rip{0%{transform:scale(.2);opacity:.34}100%{transform:scale(1);opacity:0}}
.gate-box{width:100%;max-width:290px;text-align:center;position:relative;z-index:2}
.gate-box img{width:64px;height:64px;border-radius:16px;margin:0 0 20px;box-shadow:0 6px 26px rgba(0,0,0,.28)}
.gate-box h2{margin:0 0 6px;font-family:var(--serif);font-size:20px;letter-spacing:.16em;color:#F1F4EC;font-weight:600}
.gate-box .s{margin:0 0 24px;font-size:12px;color:#93A38E;letter-spacing:.14em;line-height:1.9;font-family:var(--serif)}
#gate input{
  width:100%;padding:13px;border-radius:10px;border:1px solid #4B5B49;background:#222D25;
  color:#F0F2EA;font-family:inherit;font-size:16px;text-align:center;letter-spacing:.16em;
}
#gate input:focus{outline:none;border-color:#93A38E}
#gate button{
  width:100%;margin-top:10px;padding:13px;border-radius:10px;border:0;background:#E9EDE4;
  color:#2E3A2E;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.2em;cursor:pointer;
}
.gate-err{margin:14px 0 0;font-size:12.5px;color:#DFA089;min-height:1.3em;letter-spacing:.06em}

footer{
  margin:44px 0 0;padding:20px 0 calc(34px + var(--safe-b));
  border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--ink-3);line-height:2;letter-spacing:.05em;
}
footer b{color:var(--ink-2);font-weight:500}

/* 入ってくる */
.js .rv{opacity:0;transform:translateY(14px);
  transition:opacity .66s cubic-bezier(.22,.7,.2,1) var(--d,0s),
             transform .66s cubic-bezier(.22,.7,.2,1) var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1!important;transform:none!important;transition:none!important}
  .mist,.seigaiha,.gate-art .r{animation:none}
  .gate-art .r{opacity:.12;transform:scale(.6)}
  .sheet-in{animation:none}
  *{transition:none!important}
}

function b64b(s){var x=atob(s),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function be32(n){return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255])}

function unseal(pw){
  var C = window.crypto && window.crypto.subtle;
  if (!C) return Promise.reject(new Error('nocrypto'));
  var enc = new TextEncoder();
  var salt = enc.encode(SEALED.salt);
  var ct = b64b(SEALED.ct), tag = b64b(SEALED.tag);
  return C.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits'])
    .then(function(k){
      return C.deriveBits({name:'PBKDF2', salt:salt, iterations:SEALED.iter, hash:'SHA-256'}, k, 512);
    })
    .then(function(bits){
      var dk = new Uint8Array(bits);
      return Promise.all([
        C.importKey('raw', dk.slice(0,32), {name:'HMAC', hash:'SHA-256'}, false, ['sign']),
        C.importKey('raw', dk.slice(32),   {name:'HMAC', hash:'SHA-256'}, false, ['sign'])
      ]);
    })
    .then(function(keys){
      var kE = keys[0], kM = keys[1];
      var msg = new Uint8Array(salt.length + ct.length);
      msg.set(salt,0); msg.set(ct, salt.length);
      // タグを先に照合してから復号する
      return C.sign('HMAC', kM, msg).then(function(sig){
        var got = new Uint8Array(sig).slice(0,16), ok = got.length === tag.length;
        for (var i=0;i<tag.length;i++) ok = ok && (got[i] === tag[i]);
        if (!ok) throw new Error('bad');
        var jobs = [];
        for (var b=0;b<Math.ceil(ct.length/32);b++) jobs.push(C.sign('HMAC', kE, be32(b)));
        return Promise.all(jobs);
      });
    })
    .then(function(parts){
      var ks = new Uint8Array(parts.length*32);
      for (var i=0;i<parts.length;i++) ks.set(new Uint8Array(parts[i]), i*32);
      var pt = new Uint8Array(ct.length);
      for (var j=0;j<ct.length;j++) pt[j] = ct[j] ^ ks[j];
      return JSON.parse(new TextDecoder('utf-8').decode(pt));
    });
}

  if (q === 'HOUSE_Q') q = HOUSE_Q;

}
function transitURL(f,t){
  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(f)
       + '&destination=' + encodeURIComponent(t) + '&travelmode=transit';
}
function walkURL(f,t){
  if (f === 'HOUSE_Q') f = HOUSE_Q;
  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(f)
       + '&destination=' + encodeURIComponent(t) + '&travelmode=walking';
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function isoToday(){
  var n=new Date(), m=n.getMonth()+1, d=n.getDate();
  return n.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d;
}
function tripIdx(){
  var iso = isoToday();
  for (var i=0;i<DAYS.length;i++) if (DAYS[i].iso === iso) return i;
  return -1;
}

var WX = null, WX_STATE = 'loading';
var WXCODE = {
  0:['☀️','晴'], 1:['🌤','大致晴'], 2:['⛅️','多雲時晴'], 3:['☁️','多雲'],
  45:['🌫','霧'], 48:['🌫','霧'],
  51:['🌦','毛毛雨'], 53:['🌦','毛毛雨'], 55:['🌦','毛毛雨'], 56:['🌧','凍雨'], 57:['🌧','凍雨'],
  61:['🌧','小雨'], 63:['🌧','雨'], 65:['🌧','大雨'], 66:['🌧','凍雨'], 67:['🌧','凍雨'],
  71:['🌨','雪'], 73:['🌨','雪'], 75:['🌨','大雪'], 77:['🌨','雪'],
  80:['🌦','陣雨'], 81:['🌦','陣雨'], 82:['⛈','強陣雨'],
  85:['🌨','陣雪'], 86:['🌨','陣雪'], 95:['⛈','雷雨'], 96:['⛈','雷雨'], 99:['⛈','雷雨']
};
function loadWx(){
  var url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=35.0116&longitude=135.7681'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=Asia%2FTokyo&start_date=2026-09-17&end_date=2026-09-23&_=' + Date.now();
  return fetch(url, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      if (!d || !d.daily || !d.daily.time) throw 0;
      WX = {};
      d.daily.time.forEach(function(t,i){
        if (d.daily.temperature_2m_max[i] == null) return;
        WX[t] = {code:d.daily.weather_code[i],
                 hi:Math.round(d.daily.temperature_2m_max[i]),
                 lo:Math.round(d.daily.temperature_2m_min[i]),
                 pop:d.daily.precipitation_probability_max[i]};
      });
      WX_STATE = 'ok';
    })
    .catch(function(){ WX_STATE = 'fail'; });
}
function wxHTML(day){
  var live = WX && WX[day.iso];
  if (WX_STATE === 'loading' && !live) {
    return '<div class="wx wait"><span class="ic">⋯</span><span class="c">取得中</span>'
      + '<span class="t">行前 ' + esc(day.plan.cond) + '　' + day.plan.hi + '° / ' + day.plan.lo + '°</span>'
      + '<span class="pop">' + day.plan.pop + '%<em>降雨</em></span></div>';
  }
  var w = live || {code:null, hi:day.plan.hi, lo:day.plan.lo, pop:day.plan.pop};
  var ic, cond;
  if (w.code != null && WXCODE[w.code]) { ic = WXCODE[w.code][0]; cond = WXCODE[w.code][1]; }
  else { ic = (day.plan.pop >= 50 ? '🌧' : '☁️'); cond = day.plan.cond; }
  return '<div class="wx"><span class="ic">' + ic + '</span>'
    + '<span class="c">' + esc(cond) + '</span>'
    + '<span class="t">' + w.hi + '° / ' + w.lo + '°</span>'
    + (live ? '' : '<span class="est">行前預報</span>')
    + '<span class="pop">' + (w.pop == null ? '—' : w.pop + '%') + '<em>降雨</em></span></div>';
}

function blockHTML(b, di, bi){
  if (b.k === 'cert') return certHTML(b);
  if (b.k === 'fork') {
    return '<div class="blk hi rv"><div class="tm">' + esc(b.t||'') + '</div>'
      + '<p class="nm">' + esc(b.title) + '</p>'

      + '<div class="branch wet"><h4>' + esc(b.wet.i || '🌧') + ' ' + esc(b.wet.h) + '</h4><p>' + b.wet.p + '</p>' + actsHTML(b.wet.acts) + '</div>'
      + '</div></div>';
  }

  var cls = 'blk rv' + (b.hi ? ' hi' : '') + (b.warn ? ' warn' : '') + (b.quiet ? ' quiet' : '');
  var h = '<div class="' + cls + '">';
  h += '<div class="tm">' + esc(b.t || '') + '</div>';
  if (b.n) h += '<p class="nm">' + b.n + (b.nja ? '<span class="ja">' + esc(b.nja) + '</span>' : '') + '</p>';
  if (b.s) h += '<p class="sub">' + b.s + '</p>';
  if (b.move) {
    h += '<div class="move"><b>' + esc(b.move.f) + '</b><span class="arw">→</span><b>' + esc(b.move.t) + '</b>'
      + '<span class="meta">' + esc(b.move.by) + '<br>' + esc(b.move.min)
      + (b.move.fare ? '・' + esc(b.move.fare) : '') + '</span></div>';
  }
  if (b.note) h += '<div class="note ' + (b.note.tone||'') + '">' + b.note.html + '</div>';
  if (b.list) h += listHTML(b.list);
  if (b.shops) h += shopsHTML(b.shops, b.shopLead);
  if (b.secret) h += secretHTML(b.secret);

  return h;

}

    + '報預約人的名字也可以：<b>陳柏岳</b>。</p>');

var stage = $('#stage'), drawer = $('#drawer'), topDay = $('#top-day');
var view = null;

function buildDrawer(){
  var ti = tripIdx();
  var h = '<button class="dw-head" type="button" data-view="phome">'
        + '<span class="t">京都・家族の七日</span>'
        + '<span class="s">2026.9.17 – 9.23　·　回首頁</span></button>';
  h += '<div class="dw-sec">日程</div>';
  h += DAYS.map(function(d,i){
    var x = d.soloShort || d.hol || (d.free ? '平日' : '');
    return '<button class="dw-i" data-view="d' + i + '">'
      + '<span class="d">' + esc(d.d) + '</span>'
      + '<span>' + esc(d.tag) + '</span>'
      + (x ? '<span class="x">' + esc(x) + '</span>' : '')
      + (i===ti ? '<span class="x" style="color:#C3A468">今天</span>' : '')
      + '</button>';
  }).join('');
  h += '<div class="dw-rule"></div><div class="dw-sec">隨時打得開</div>';
  h += Object.keys(PAGE_META).filter(function(k){ return k !== 'home'; }).map(function(k){
    return '<button class="dw-i" data-view="p' + k + '">'
      + '<span class="ic">' + PAGE_META[k][0] + '</span><span>' + PAGE_META[k][1] + '</span></button>';
  }).join('');
  h += '<div class="dw-rule"></div>'
     + '<button class="dw-i" id="theme-btn" type="button" data-theme-btn="1">'
     + '<span class="ic">☾</span><span class="t">夜</span>'
     + '<span class="x">按一下切換</span></button>';
  drawer.innerHTML = h;
  syncThemeBtn();
}

function setDrawer(open){
  document.documentElement.classList.toggle('drawer', !!open);
  $('#burger').setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) document.documentElement.classList.add('locked');
  else document.documentElement.classList.remove('locked');
}

function reveal(){
  var els = [].slice.call(stage.querySelectorAll('.rv'));
  if (!('IntersectionObserver' in window)) {
    els.forEach(function(el){ el.classList.add('in'); }); return;
  }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(el,i){
    el.style.setProperty('--d', Math.min(i,6)*0.045 + 's');
    io.observe(el);
  });
}

function go(v, remember){
  view = v;
  if (v.charAt(0) === 'd') {
    var i = +v.slice(1);
    stage.innerHTML = dayHTML(DAYS[i], i);
    topDay.textContent = DAYS[i].d + '（' + DAYS[i].dow + '）';
  } else {
    var k = v.slice(1);
    stage.innerHTML = (PAGES[k] || PAGES.about)();
    topDay.textContent = PAGE_META[k] ? PAGE_META[k][1] : '';
  }
  [].slice.call(drawer.querySelectorAll('[data-view]')).forEach(function(el){
    el.setAttribute('aria-current', el.getAttribute('data-view') === v ? 'true' : 'false');
  });
  if (remember !== false) lsSet(LS_VIEW, v);
  window.scrollTo(0,0);
  reveal();
}

$('#burger').addEventListener('click', function(){
  setDrawer(!document.documentElement.classList.contains('drawer'));
});
$('#scrim').addEventListener('click', function(){ setDrawer(false); });

document.addEventListener('click', function(e){
  var nav = e.target.closest('[data-view]');
  if (nav) { setDrawer(false); go(nav.getAttribute('data-view')); return; }
  var pg = e.target.closest('[data-page]');
  if (pg) { e.preventDefault(); go('p' + pg.getAttribute('data-page')); return; }
  if (e.target.closest('[data-theme-btn]')) { cycleTheme(); return; }
  var ja = e.target.closest('[data-ja]');
  if (ja) { jaSheet(ja.getAttribute('data-ja')); return; }
  if (e.target.closest('[data-qr]')) { qrSheet(); return; }
  var td = e.target.closest('[data-todo]');
  if (td) {
    var id = td.getAttribute('data-todo'), on = td.getAttribute('data-on') === '1';
    td.setAttribute('data-on', on ? '0' : '1');
    var saved = {};
    try { saved = JSON.parse(lsGet(LS_TODO,'{}')) || {}; } catch(err){}
    if (on) delete saved[id]; else saved[id] = 1;
    lsSet(LS_TODO, JSON.stringify(saved));
  }
});

/* ==========================================================================
   9. 門
   ========================================================================== */
var gate = $('#gate'), gErr = $('#gate-err'), gPw = $('#gate-pw');

function start(){
  buildDrawer();
  // 旅行中なら「今日」。それ以外は首頁 —— 前に見た画面より、
  // 「何があるか」が見えるほうが開いた瞬間の役に立つ。
  var ti = tripIdx();
  var v = ti >= 0 ? ('d' + ti) : 'phome';
  go(v, false);
  loadWx().then(function(){ if (view && view.charAt(0) === 'd') go(view, false); });
}

function unlockWith(pw, quiet){
  return unseal(pw).then(function(obj){
    SECRET = obj;
    lsSet(LS_PW, pw);
    gate.hidden = true;
    document.documentElement.classList.remove('locked');
    start();
    return true;
  }).catch(function(err){
    if (!quiet) {
      gErr.textContent = (err && err.message === 'nocrypto')
        ? '這個瀏覽器不支援解鎖，請用 https 開啟。'
        : '通關碼不對';
      try { gPw.select(); } catch(e){}
    }
    return false;
  });
}

$('#gate-form').addEventListener('submit', function(e){
  e.preventDefault();
  gErr.textContent = '解鎖中…';
  unlockWith(gPw.value.trim(), false);
});

(function(){
  function showGate(){
    gate.hidden = false;
    document.documentElement.classList.add('locked');
    setTimeout(function(){ try{ gPw.focus(); }catch(e){} }, 60);
  }
  var saved = lsGet(LS_PW, '');
  if (saved) unlockWith(saved, true).then(function(ok){ if (!ok) showGate(); });
  else showGate();
})();

/* ==========================================================================
   10. 夜
   17:00〜05:59 は夜。九月の京都は 18 時過ぎにはもう暗い。
   駅のホームで白い画面を出すのは目にも電池にもよくないので、勝手に落とす。
   抽斗のスイッチで固定もできる（localStorage に残る）。
   ========================================================================== */
var LS_THEME = 'kf.theme';
function themePref(){ return lsGet(LS_THEME, 'auto'); }
function wantsNight(){
  var q = (location.search.match(/[?&]theme=(night|day)/) || [])[1];
  if (q) return q === 'night';
  var pref = themePref();
  if (pref === 'night') return true;
  if (pref === 'day')   return false;
  var h = new Date().getHours();
  return h >= 17 || h < 6;
}
function applyTheme(force){
  var want = wantsNight() ? 'night' : 'day';
  var root = document.documentElement;
  if (!force && (root.getAttribute('data-theme') || 'day') === want) return;
  // QR を出している最中に色が変わると読み取りの邪魔になる。閉じるまで待つ。
  if (!force && sheet.classList.contains('on') && sheetIn.querySelector('.qrbox')) {
    sheet.addEventListener('click', function(){ setTimeout(applyTheme, 400); }, {once:true});
    return;
  }
  if (want === 'night') root.setAttribute('data-theme','night');
  else root.removeAttribute('data-theme');
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', want === 'night' ? '#151814' : '#F7F5EE');
  syncThemeBtn();
}
function syncThemeBtn(){
  var b = $('#theme-btn'); if (!b) return;
  var pref = themePref();
  var isNight = (document.documentElement.getAttribute('data-theme') === 'night');
  // 表示は「いま実際にどうなっているか」。pref は「固定／自動」の別だけに使う。
  var lbl = (isNight ? '夜' : '白天') + (pref === 'auto' ? '（自動）' : '（固定）');
  b.querySelector('.t').textContent = lbl;
  b.querySelector('.ic').textContent = isNight ? '☾' : '☀';
}
function cycleTheme(){
  var order = ['auto','night','day'];
  var i = order.indexOf(themePref());
  lsSet(LS_THEME, order[(i + 1) % order.length]);
  applyTheme(true);
}
setInterval(applyTheme, 60000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) applyTheme(); });
